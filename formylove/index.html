    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;
    background-color:var(--parchment-deep);
    color:var(--charcoal);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:32px 16px 64px;
  }
  .brief{
    width:100%;
    max-width:600px;
    background:var(--parchment);
    border-radius:22px;
    border:1px solid rgba(23,35,51,0.06);
    box-shadow:0 2px 8px rgba(23,35,51,0.10), 0 20px 50px rgba(23,35,51,0.16);
    padding:0 30px 36px;
    overflow:hidden;
  }
  .masthead{
    background:var(--oxford);
    color:var(--gold);
    font-family:'Newsreader',serif;
    font-style:italic;
    font-size:13px;
    letter-spacing:.2px;
    padding:18px 28px 14px;
    margin:0 -30px 6px;
    text-align:center;
  }
  .masthead .masthead-date{color:#9AA4B2;font-style:normal;}
  .flourish{
    text-align:center;
    color:var(--rose);
    font-size:15px;
    letter-spacing:.4px;
    margin:0 0 26px;
    opacity:.75;
  }
  .footer-band{
    background:var(--oxford);
    color:var(--gold);
    font-family:'Newsreader',serif;
    font-style:italic;
    font-size:12.5px;
    text-align:center;
    padding:16px 28px;
    margin:32px -30px -36px;
  }
  .brief-body{padding-top:8px;}
  .kicker{
    font-family:'Newsreader',serif;
    font-style:italic;
    font-size:14px;
    color:#A9822B;
    margin:0 0 6px;
  }
  h1{
    font-family:'Newsreader',serif;
    font-weight:500;
    font-size:34px;
    line-height:1.2;
    margin:0 0 16px;
    color:var(--oxford);
    letter-spacing:.1px;
  }
  h2{
    font-family:'Newsreader',serif;
    font-weight:500;
    font-size:24px;
    line-height:1.3;
    margin:0 0 10px;
    color:var(--oxford);
  }
  p.lead{
    font-size:15.5px;
    line-height:1.75;
    color:var(--charcoal-dim);
    margin:0 0 22px;
  }
  .signoff{
    font-family:'Parisienne',cursive;
    font-size:26px;
    color:var(--oxford);
    margin:28px 0 0;
    line-height:1;
  }
  .progress{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin-bottom:8px;
  }
  .progress .dot{
    width:7px;height:7px;border-radius:50%;
    background:var(--line);
    flex-shrink:0;
    transition:background .2s ease, transform .2s ease;
  }
  .progress .dot.active{
    background:var(--rose);
    transform:scale(1.4);
  }
  .progress .dot.done{
    background:var(--gold);
  }
  .progress-label{
    text-align:center;
    font-family:'Newsreader',serif;
    font-style:italic;
    font-size:13px;
    color:var(--charcoal-dim);
    margin-bottom:26px;
  }

  .step{display:none;}
  .step.active{display:block;}

  label.field-label{
    display:block;
    font-size:13px;
    color:var(--charcoal-dim);
    margin-bottom:8px;
  }
  input[type=text]{
    width:100%;
    background:var(--parchment);
    border:1px solid var(--line);
    color:var(--charcoal);
    padding:13px 16px;
    font-family:'Newsreader',serif;
    font-size:16px;
    border-radius:12px;
  }
  input[type=text]:focus{outline:none;border-color:var(--rose);}
  input[type=text]::placeholder{color:#9C9384;font-style:italic;}

  .guest-row{display:flex;gap:8px;margin-bottom:16px;}
  .guest-row input{flex:1;}
  .btn-add{
    background:transparent;
    border:1px solid var(--gold);
    color:var(--oxford);
    padding:0 18px;
    font-family:'Newsreader',serif;
    font-style:italic;
    font-size:15px;
    cursor:pointer;
    border-radius:12px;
  }
  .btn-add:hover{background:var(--gold);color:var(--oxford);}

  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px;min-height:20px;}
  .chip{
    background:var(--parchment-light);
    border:1px solid var(--line);
    padding:7px 10px 7px 14px;
    border-radius:16px;
    font-size:13.5px;
    font-family:'Newsreader',serif;
    display:flex;align-items:center;gap:8px;
    color:var(--charcoal);
  }
  .chip button{
    background:none;border:none;color:var(--charcoal-dim);
    cursor:pointer;font-size:14px;line-height:1;padding:0;
  }
  .chip button:hover{color:var(--rose);}
  .guest-count{font-size:13px;font-style:italic;color:var(--charcoal-dim);margin-top:4px;font-family:'Newsreader',serif;}
  .guest-count.warn{color:var(--rose);}

  .options{display:flex;flex-direction:column;gap:12px;margin-bottom:8px;}
  .option-card{
    border:1px solid var(--line);
    background:var(--parchment-light);
    padding:16px 18px;
    cursor:pointer;
    border-radius:14px;
    transition:border-color .2s ease, background .2s ease, transform .15s ease;
  }
  .option-card:hover{border-color:var(--rose);transform:translateY(-1px);}
  .option-card.selected{border-color:var(--oxford);background:var(--oxford);}
  .option-card .opt-title{
    font-family:'Newsreader',serif;
    font-size:18px;
    color:var(--oxford);
    margin-bottom:3px;
  }
  .option-card .opt-sub{
    font-size:13.5px;
    font-style:italic;
    color:var(--charcoal-dim);
  }
  .option-card.selected .opt-title{color:var(--parchment);}
  .option-card.selected .opt-sub{color:#C7CCD6;}

  .nav-row{
    display:flex;justify-content:space-between;
    align-items:center;
    margin-top:28px;
  }
  .btn{
    font-family:'Inter',sans-serif;
    font-size:14px;font-weight:500;
    padding:12px 24px;
    border-radius:24px;
    cursor:pointer;
    border:1px solid transparent;
    display:inline-block;
    text-decoration:none;
    transition:all .18s ease;
  }
  .btn-primary{
    background:var(--gold);
    color:var(--oxford);
    border-color:var(--gold);
  }
  .btn-primary:disabled{
    opacity:.4;cursor:not-allowed;
  }
  .btn-primary:not(:disabled):hover{background:var(--oxford);color:var(--gold);border-color:var(--oxford);transform:translateY(-1px);}
  .btn-ghost{
    background:transparent;
    color:var(--charcoal-dim);
    border-color:var(--line);
  }
  .btn-ghost:hover{color:var(--oxford);border-color:var(--oxford);}

  .result-toast{
    font-size:13.5px;font-family:'Newsreader',serif;font-style:italic;color:var(--charcoal-dim);margin-bottom:20px;
    background:var(--parchment-light);
    border-radius:14px;
    padding:16px 18px;
  }
  .result-toast strong{color:var(--oxford);font-style:normal;}

  .venue-card{
    border:1px solid var(--line);
    background:var(--parchment-light);
    padding:22px;
    margin-bottom:18px;
    border-radius:16px;
    position:relative;
  }
  .venue-card.top{
    border-color:var(--oxford);
    background:var(--oxford);
    border-top:1px solid var(--oxford);
  }
  .venue-card.top::before{
    content:'Best match';
    position:absolute;
    top:-11px;left:22px;
    background:var(--gold);
    color:var(--oxford);
    padding:3px 12px;
    border-radius:12px;
    font-size:10.5px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    letter-spacing:.3px;
  }
  .venue-badge{
    display:inline-block;
    font-family:'Newsreader',serif;
    font-style:italic;
    font-size:13px;
    color:var(--rose);
    margin-bottom:10px;
  }
  .venue-card.top .venue-badge{color:var(--gold);}
  .venue-name{
    font-family:'Newsreader',serif;
    font-size:22px;
    color:var(--oxford);
    margin:0 0 4px;
  }
  .venue-card.top .venue-name{color:var(--parchment);}
  .venue-area{
    font-size:13px;color:var(--charcoal-dim);margin-bottom:10px;
  }
  .venue-card.top .venue-area{color:#C7CCD6;}
  .venue-blurb{
    font-size:14.5px;line-height:1.55;color:var(--charcoal);margin-bottom:10px;
  }
  .venue-card.top .venue-blurb{color:var(--parchment);}
  .venue-why{
    font-size:13px;color:#A9822B;line-height:1.5;
  }
  .venue-card.top .venue-why{color:var(--gold);}
  .venue-note{
    font-size:12.5px;color:var(--charcoal-dim);margin-top:8px;font-style:italic;
    font-family:'Newsreader',serif;
  }
  .venue-card.top .venue-note{color:#C7CCD6;}
  .venue-link{
    display:inline-block;
    margin-top:12px;
    font-size:13px;
    font-weight:500;
    color:var(--oxford);
    text-decoration:none;
    border-bottom:1px solid var(--gold);
  }
  .venue-link:hover{color:var(--gold);}
  .venue-card.top .venue-link{color:var(--gold);border-bottom-color:var(--gold);}
  .venue-card.top .venue-link:hover{color:var(--parchment);}
  .venue-card.chosen{border-color:var(--rose);box-shadow:0 0 0 2px var(--rose);}
  .pick-btn{
    display:block;
    margin-top:14px;
    width:100%;

let currentStep = 0;

function render(){
  const app = document.getElementById('app');
  if(currentStep===0) app.innerHTML = renderIntro();
  else if(currentStep===1) app.innerHTML = renderGuests();
  else if(currentStep===2) app.innerHTML = renderChoice('format', 'How do you want the night to go?', 'Pick whatever feels right — we can always add a second stop after.', FORMATS);
  else if(currentStep===3) app.innerHTML = renderChoice('area', 'Anywhere in KL calling your name?', 'Totally optional — skip it if it doesn\'t matter to you.', AREAS);
  else if(currentStep===4) app.innerHTML = renderChoice('mood', 'And the mood — how should it feel?', 'You know better than anyone what kind of room makes you feel at ease.', MOODS);
  else if(currentStep===5) app.innerHTML = renderResults();
  else if(currentStep===6) app.innerHTML = renderConfirm();
  attachHandlers();
}

const STEP_LABELS = { 1:'your people', 2:'the format', 3:'the area', 4:'the mood' };
function progressBar(activeIndex){
  // activeIndex 1..4
  let html = '<div class="progress">';
  for(let i=1;i<=4;i++){
    const cls = i<activeIndex ? 'done' : (i===activeIndex ? 'active' : '');
    html += `<span class="dot ${cls}"></span>`;
  }
  html += '</div>';
  html += `<div class="progress-label">a few little questions — right now, ${STEP_LABELS[activeIndex]}</div>`;
  return html;
}

function renderIntro(){
  return `
    <p class="kicker">In re: Jeremy's Call to the Bar</p>
    <h1>You did it, my love. Let's celebrate you properly.</h1>
    <p class="lead">All those years, all the late nights — and now, you're finally being called to the Malaysian Bar.</p>
    <p class="lead">I want that night to feel exactly right: your people, the right kind of evening, a Negroni in your hand, somewhere beautiful.</p>
    <p class="lead">Answer a few quick questions exactly as you would, and I'll match what you want with the nicest places I've found around KL.</p>
    <p class="lead">This is your moment. I just want to make it one you'll remember.</p>
    <div class="nav-row">
      <div></div>
      <button class="btn btn-primary" id="startBtn">Let's plan it</button>
    </div>
    <p class="signoff">with all my love, Dane</p>
  `;
}

function renderGuests(){
  const chips = state.guests.map((g,i)=>`<div class="chip">${escapeHtml(g)}<button data-idx="${i}" class="remove-guest">&times;</button></div>`).join('');

  const warn = count>10;
  return `
    ${progressBar(1)}
    <h2>Who do you want cheering for you that night?</h2>
    <p class="lead">Family, closest friends — the ones who watched you get here. Add them one at a time.</p>

    </div>
    <div class="chips">${chips}</div>
    <div class="guest-count ${warn?'warn':''}">${count} ${count===1?'dear one':'dear ones'} so far${warn?' — a wonderfully big crowd. Let\'s just make sure the room can hold everyone we love' : ''}</div>
    <div class="nav-row">
      <button class="btn btn-ghost" id="backBtn">Back</button>
      <button class="btn btn-primary" id="nextBtn">Continue</button>
    </div>
  `;
}

function renderChoice(key, title, sub, options){
  const cards = options.map(o => `
    <div class="option-card ${state[key]===o.id?'selected':''}" data-key="${key}" data-value="${o.id}">
      <div class="opt-title">${o.title}</div>
      <div class="opt-sub">${o.sub}</div>
    </div>
  `).join('');
  return `
    ${progressBar(currentStep)}
    <h2>${title}</h2>
    <p class="lead">${sub}</p>
    <div class="options">${cards}</div>
    <div class="nav-row">
      <button class="btn btn-ghost" id="backBtn">Back</button>
      <button class="btn btn-primary" id="nextBtn" ${state[key]?'':'disabled'}>Continue</button>
    </div>
  `;
}

function scoreVenue(v){
  let score = 0;
  const format = state.format;
  const guestCount = Math.max(state.guests.length, 1);

  if(format==='dinner' && !(v.type==='dinner'||v.type==='both')) return null;
  if(format==='bar' && !(v.type==='bar'||v.type==='both')) return null;
  // 'both' allows any venue to appear, scored on its own type too

  if(format==='both' && v.type==='both') score += 3;

  if(state.mood && v.moods.includes(state.mood)) score += 3;
  if(state.area && state.area!=='any' && v.area===state.area) score += 2;

  if(guestCount > v.capacity) score -= 4;
  else score += 1;

  // small nudge toward the more standout/signature venues — only breaks ties,
  // never outweighs a real mood, area or capacity difference
  score += (v.tier - 1) * 0.5;

  return score;
}

function renderResults(){
  let candidates = VENUES.map(v => ({ v, score: scoreVenue(v) })).filter(x => x.score !== null);
  candidates.sort((a,b) => b.score - a.score);

  const guestCount = state.guests.length;
  const top = candidates.slice(0, 3);

  let comboHtml = '';
  if(state.format === 'both'){
    const dinnerPick = candidates.map(c=>c.v).find(v => v.type==='dinner' || v.type==='both');
    const barPick = candidates.map(c=>c.v).find(v => (v.type==='bar') && v.id !== (dinnerPick? dinnerPick.id : null));
    if(dinnerPick && barPick){
      comboHtml = `
        <div class="combo">
          <h2>Or, split the night in two</h2>
          <div class="combo-flow">${dinnerPick.name} <span class="arrow">&rarr;</span> ${barPick.name}</div>
          <p class="lead" style="margin-bottom:0;">Dinner at ${dinnerPick.name}, then walk over for negronis and the toast at ${barPick.name}.</p>
        </div>
      `;
    }
  }

  const cardsHtml = top.map(({v,score}, idx) => {
    const isTop = idx===0;
    const reasons = [];
    if(state.mood && v.moods.includes(state.mood)) reasons.push(`just the ${MOOD_LABELS[state.mood].toLowerCase()} feeling you were after`);
    if(state.area && state.area!=='any' && v.area===state.area) reasons.push(`tucked right in ${v.area}, like you wanted`);
    if(guestCount > v.capacity) reasons.push(`a little cosy for ${guestCount} — worth a quick call ahead so everyone fits`);
    else if(guestCount>0) reasons.push(`plenty of room for your ${guestCount}`);
    const typeLabel = v.type==='dinner' ? 'Dinner' : v.type==='bar' ? 'Bar / drinks' : 'Dinner + bar in one';

    const selected = state.selectedVenueId===v.id;

    return `
      <div class="venue-card ${isTop?'top':''} ${selected?'chosen':''}" data-venue-id="${v.id}">
        <span class="venue-badge">${typeLabel}</span>
        <div class="venue-name">${v.name}</div>
        <div class="venue-area">${v.area}</div>
        <div class="venue-blurb">${v.blurb}</div>
        ${reasons.length ? `<div class="venue-why">${reasons.join(' · ')}</div>` : ''}
        <a class="venue-link" href="${v.website}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Visit website &rarr;</a>
        <button class="pick-btn ${selected?'picked':''}" data-venue-id="${v.id}">${selected ? 'This is the one ✓' : 'Pick this one'}</button>
      </div>
    `;
  }).join('');

  const guestLine = state.guests.length
    ? `Cheering you on: ${state.guests.join(', ')}`
    : 'No guest list added yet';

  return `
    <p class="kicker">For Jeremy, with love</p>
    <h1>Here's the night I think fits you best.</h1>
    <div class="result-toast">
      <strong>${guestLine}</strong><br>
      ${state.format ? FORMATS.find(f=>f.id===state.format).title : ''}${state.area && state.area!=='any' ? ' · ' + state.area : ''}${state.mood ? ' · ' + MOOD_LABELS[state.mood] : ''}
    </div>
    ${cardsHtml || '<p class="lead">Nothing matched every filter perfectly — try loosening the area or mood and see what turns up.</p>'}
    ${comboHtml}
    <p class="lead" style="margin-top:26px;">Whichever one you pick, I just want you surrounded by the people who love you, a drink in hand, knowing how proud everyone is. Congratulations, Jeremy — you earned every bit of this.</p>
    <div class="nav-row">
      <button class="btn btn-ghost" id="restartBtn">Start over</button>
      <button class="btn btn-primary" id="confirmBtn" ${state.selectedVenueId?'':'disabled'}>Confirm my pick</button>
    </div>
    <p class="signoff">choose whichever feels like you, my love</p>
  `;
}

function renderConfirm(){
  const chosen = VENUES.find(v => v.id===state.selectedVenueId);
  const guestLine = state.guests.length ? state.guests.join(', ') : '(no guest list added)';
  const formatLine = state.format ? FORMATS.find(f=>f.id===state.format).title : '—';
  const areaLine = state.area && state.area!=='any' ? state.area : 'No preference';
  const moodLine = state.mood ? MOOD_LABELS[state.mood] : '—';

  const subject = `Jeremy's answer — Call to the Bar night`;
  const body =
`Hi love,

Here's what I picked for my Call to the Bar celebration:

Venue: ${chosen ? chosen.name : '(none selected)'}${chosen ? ' — ' + chosen.website : ''}
Format: ${formatLine}
Area: ${areaLine}
Mood: ${moodLine}
Guests: ${guestLine}

Can't wait. Love you.`;

  const mailtoHref = `mailto:${DANE_EMAIL}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;

  return `
    <p class="kicker">Almost there</p>
    <h1>Ready to send this to me?</h1>
    <p class="lead">Double-check everything below — once you hit send, I'll have exactly what I need to book it.</p>
    <div class="result-toast" style="line-height:1.9;">
      <strong>Venue:</strong> ${chosen ? escapeHtml(chosen.name) : '—'}<br>
      <strong>Format:</strong> ${escapeHtml(formatLine)}<br>
      <strong>Area:</strong> ${escapeHtml(areaLine)}<br>
      <strong>Mood:</strong> ${escapeHtml(moodLine)}<br>
      <strong>Guests:</strong> ${escapeHtml(guestLine)}
    </div>
    <div class="nav-row">
      <button class="btn btn-ghost" id="backToResultsBtn">Back, let me change something</button>
      <a class="btn btn-primary" id="sendBtn" href="${mailtoHref}">Send this to Dane &rarr;</a>
    </div>
    <p class="lead" style="margin-top:20px;font-size:13px;color:var(--charcoal-dim);">This opens your email app with everything filled in — just hit send.</p>
    <p class="signoff">so proud of you, always</p>
  `;
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function attachHandlers(){
  if(currentStep===0){
    document.getElementById('startBtn').addEventListener('click', () => { currentStep=1; render(); });
  }
  if(currentStep===1){
    const input = document.getElementById('guestInput');
    const addGuest = () => {
      const val = input.value.trim();
      if(val){ state.guests.push(val); input.value=''; render(); document.getElementById('guestInput').focus(); }
    };
    document.getElementById('addGuestBtn').addEventListener('click', addGuest);
    input.addEventListener('keydown', e => { if(e.key==='Enter'){ e.preventDefault(); addGuest(); } });
    document.querySelectorAll('.remove-guest').forEach(btn => {
      btn.addEventListener('click', e => {
        const idx = parseInt(e.target.getAttribute('data-idx'));
        state.guests.splice(idx,1);
        render();
      });
    });
    document.getElementById('backBtn').addEventListener('click', () => { currentStep=0; render(); });
    document.getElementById('nextBtn').addEventListener('click', () => { currentStep=2; render(); });
  }
  if(currentStep>=2 && currentStep<=4){
    document.querySelectorAll('.option-card').forEach(card => {
      card.addEventListener('click', () => {
        const key = card.getAttribute('data-key');
        const value = card.getAttribute('data-value');
        state[key] = value;
        render();
      });
    });
    const backBtn = document.getElementById('backBtn');
    const nextBtn = document.getElementById('nextBtn');
    if(backBtn) backBtn.addEventListener('click', () => { currentStep -= 1; render(); });
    if(nextBtn) nextBtn.addEventListener('click', () => {
      if(nextBtn.disabled) return;
      currentStep += 1;
      render();
    });
  }
  if(currentStep===5){
    document.querySelectorAll('.pick-btn').forEach(btn => {
      btn.addEventListener('click', e => {
        e.stopPropagation();
        state.selectedVenueId = btn.getAttribute('data-venue-id');
        render();
      });
    });
    document.getElementById('restartBtn').addEventListener('click', () => {
      state = { guests:[], format:null, area:null, mood:null, selectedVenueId:null };
      currentStep = 0;
      render();
    });
    const confirmBtn = document.getElementById('confirmBtn');
    if(confirmBtn) confirmBtn.addEventListener('click', () => {
      if(confirmBtn.disabled) return;
      currentStep = 6;
      render();
    });
  }
  if(currentStep===6){
    document.getElementById('backToResultsBtn').addEventListener('click', () => {
      currentStep = 5;
      render();
    });
  }
}

render();
</script>
</body>
</html>
